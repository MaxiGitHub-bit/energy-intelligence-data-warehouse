<text x='60' y='402' font-family='Segoe UI, Helvetica Neue, Arial, sans-serif' font-size='12' fill='#0A3D2E' font-weight='bold' text-anchor='start'>Why ELT rather than ETL</text>
<text x='60' y='422' font-family='Segoe UI, Helvetica Neue, Arial, sans-serif' font-size='11' fill='#5F6F68' font-weight='normal' text-anchor='start'>SSIS lands the raw extract untyped, so no source value can fail on ingestion and the full payload reaches a</text>
<text x='60' y='438' font-family='Segoe UI, Helvetica Neue, Arial, sans-serif' font-size='11' fill='#5F6F68' font-weight='normal' text-anchor='start'>queryable surface. Lookups run afterwards as SQL joins against the governance registry, under observation.</text>
<text x='40' y='502' font-family='Segoe UI, Helvetica Neue, Arial, sans-serif' font-size='11' fill='#5F6F68' font-weight='normal' text-anchor='start'>Layer boundaries are separate databases, not schemas: the separation is enforced by the engine rather than by convention.</text>
<text x='40' y='524' font-family='Segoe UI, Helvetica Neue, Arial, sans-serif' font-size='11' fill='#5F6F68' font-weight='normal' text-anchor='start'>Referential integrity is declared in Layer 3 only.</text>
