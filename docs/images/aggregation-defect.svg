<text x='60' y='530' font-family='Segoe UI, Helvetica Neue, Arial, sans-serif' font-size='11' fill='#5F6F68' font-weight='normal' text-anchor='start'>exclusion at the boundary. Across the warehouse, a naive sum overstates by roughly 8x.</text>
